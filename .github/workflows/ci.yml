name: Windows x64 tests and Release

on:
  push:
    branches: [main, fix/hevc-frame-size]
  pull_request:
  workflow_dispatch:
    inputs:
      build_release:
        description: Build the standalone Windows test package after validation
        type: boolean
        default: false
      capture_run:
        description: Capture complete panels from a successful CI debug artifact (no software changes)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    if: ${{ !inputs.capture_run }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up the tested Rust toolchain
        shell: pwsh
        run: |
          rustup show
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Cache Cargo downloads and dependency builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: maccanvas-rust-v1
          env-vars: ImageOS ImageVersion
          cache-bin: false
          cache-workspace-crates: false
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Validate audio component policy (build converter from source)
        shell: pwsh
        run: .\scripts\Test-AudioComponent.ps1
      - name: Validate Rust and installer
        shell: pwsh
        run: |
          python scripts/check_brand.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/translations.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path crates\audio-codec-tool\Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --all-targets --locked --package maccanvas --package native-hevc --package audio-codec-tool
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --test windows_clipboard --locked -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --all-targets --locked --package maccanvas --package audio-codec-tool -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\Test-Installer.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build executable for UI checks
        shell: pwsh
        run: |
          cargo build --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Export UI diagnostic executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Sovelyx-Desk-UI-debug-${{ github.sha }}
          path: target/x86_64-pc-windows-msvc/debug/maccanvas.exe
          retention-days: 7
          if-no-files-found: error
      - name: Verify login UI themes and scale factors
        shell: pwsh
        run: |
          $exe = 'target\x86_64-pc-windows-msvc\debug\maccanvas.exe'
          .\scripts\Capture-Readme.ps1 -Executable $exe -PreviewTheme light -OutputDirectory "$env:RUNNER_TEMP\login-ui"
          .\scripts\Capture-Readme.ps1 -Executable $exe -PreviewTheme dark -OutputDirectory "$env:RUNNER_TEMP\login-ui"
          foreach ($scale in @('1.25', '1.5', '2')) {
            .\scripts\Capture-Readme.ps1 -Executable $exe -PreviewTheme light -ScaleFactor $scale -OutputDirectory "$env:RUNNER_TEMP\login-ui"
          }
      - name: Verify device layouts and capture P2 UI states
        shell: pwsh
        run: |
          $exe = 'target\x86_64-pc-windows-msvc\debug\maccanvas.exe'
          foreach ($count in @(0, 1, 3, 6)) {
            .\scripts\Capture-Readme.ps1 -Executable $exe -PreviewTheme light -DeviceCount $count -WindowWidth 1280 -WindowHeight 720 -OutputDirectory "$env:RUNNER_TEMP\login-ui"
          }
          foreach ($size in @(@(1440,900), @(1920,1080), @(2560,1440))) {
            .\scripts\Capture-Readme.ps1 -Executable $exe -PreviewTheme light -DeviceCount 6 -WindowWidth $size[0] -WindowHeight $size[1] -OutputDirectory "$env:RUNNER_TEMP\login-ui"
          }
          .\scripts\Capture-Readme.ps1 -Executable $exe -PreviewTheme light -DeviceCount 6 -WindowWidth 3840 -WindowHeight 2160 -ScaleFactor 2 -OutputDirectory "$env:RUNNER_TEMP\login-ui"
      - name: Verify loopback connection states and full screen
        shell: pwsh
        run: python scripts/test_device_session_ui.py --executable target/x86_64-pc-windows-msvc/debug/maccanvas.exe --output "$env:RUNNER_TEMP/login-ui"
      - name: Verify Chinese UI and live language switching
        shell: pwsh
        run: |
          python scripts/test_device_session_ui.py --executable target/x86_64-pc-windows-msvc/debug/maccanvas.exe --language zh-CN --output "$env:RUNNER_TEMP/login-ui"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($scale in @('1', '1.25', '1.5', '2')) {
            .\scripts\Capture-Readme.ps1 -Language zh-CN -PreviewTheme light -ScaleFactor $scale -OutputDirectory "$env:RUNNER_TEMP\login-ui"
          }
      - name: Export login UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UI-check-screenshots-${{ github.sha }}
          path: ${{ runner.temp }}/login-ui/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Build and package Windows x64 executables
        if: github.ref_name != 'codex/p2-ui-device-management' || inputs.build_release
        shell: pwsh
        run: |
          $sourceChanges = @(git status --porcelain)
          if ($LASTEXITCODE -ne 0 -or $sourceChanges.Count -ne 0) {
            throw "Release source worktree must be clean before compilation: $sourceChanges"
          }
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --example update_probe --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\Test-SelfUpdate.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content Cargo.toml -Raw | Select-String '(?m)^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          .\scripts\Package-Release.ps1 -Version "v$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Export verified Windows x64 package
        if: github.ref_name != 'codex/p2-ui-device-management' || inputs.build_release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Sovelyx-Desk-windows-x64-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  capture:
    if: ${{ inputs.capture_run != '' }}
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Capture owned English and Chinese windows within the virtual desktop
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTURE_RUN: ${{ inputs.capture_run }}
        run: |
          if ($env:CAPTURE_RUN -notmatch '^[0-9]+$') { throw 'Expected a numeric CI run id.' }
          $sourceRun = gh run view $env:CAPTURE_RUN --repo $env:GITHUB_REPOSITORY --json headSha,conclusion | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $sourceRun.conclusion -ne 'success') { throw 'Only a successful verified CI build may be captured.' }
          $captureExeDir = Join-Path $env:RUNNER_TEMP 'capture-exe'
          gh run download $env:CAPTURE_RUN --repo $env:GITHUB_REPOSITORY --name "Sovelyx-Desk-UI-debug-$($sourceRun.headSha)" --dir $captureExeDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $captureExe = Join-Path $captureExeDir 'maccanvas.exe'
          $captureOutput = Join-Path $env:RUNNER_TEMP 'complete-ui'
          foreach ($language in @('en','zh-CN')) {
            python scripts/test_device_session_ui.py --executable $captureExe --output $captureOutput --language $language --window-width 1000 --window-height 700
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $metadata = @{ build_commit=$sourceRun.headSha; source_run=$env:CAPTURE_RUN; executable_sha256=(Get-FileHash -LiteralPath $captureExe -Algorithm SHA256).Hash.ToLowerInvariant(); build_type='debug UI; same source commit as verified Release'; requested_window='1000x700' }
          $metadata | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $captureOutput 'capture-source.json') -Encoding utf8
      - name: Export complete bilingual screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Sovelyx-Desk-complete-UI-${{ github.sha }}
          path: ${{ runner.temp }}/complete-ui/*
          if-no-files-found: error
          retention-days: 14
