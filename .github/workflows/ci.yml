name: Windows checks

on:
  push:
    branches: [main, fix/hevc-frame-size]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac-clipboard:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up the pinned Rust toolchain
        run: rustup show
      - name: Test portable HEVC bitstream and display geometry
        run: |
          rustc --edition=2024 --test -D warnings scripts/test_hevc_bitstream.rs -o "$RUNNER_TEMP/hevc-bitstream-tests"
          "$RUNNER_TEMP/hevc-bitstream-tests"
      - name: Test HEVC diagnostics and unchanged pacing behavior
        run: |
          rustc --edition=2024 --test -D warnings scripts/test_hevc_diagnostics.rs -o "$RUNNER_TEMP/hevc-diagnostics-tests"
          "$RUNNER_TEMP/hevc-diagnostics-tests"
      - name: Verify the native macOS Unicode clipboard helpers
        run: python3 scripts/test_macos_clipboard.py
      - name: Verify native Apple audio conformance encoding
        run: |
          clang -std=c11 -O2 scripts/generate_macos_audio_fixture.c -framework AudioToolbox -framework AudioUnit -framework CoreAudio -o "$RUNNER_TEMP/native-audio-fixture"
          cd "$RUNNER_TEMP"
          ./native-audio-fixture stereo.aaceld
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up the tested Rust toolchain
        shell: pwsh
        run: |
          rustup show
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate audio component policy (build converter from source)
        shell: pwsh
        run: .\scripts\Test-AudioComponent.ps1
      - name: Validate Rust and installer
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path crates\audio-codec-tool\Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --all-targets --locked --package maccanvas --package native-hevc --package audio-codec-tool
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --test windows_clipboard --locked -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --all-targets --locked --package maccanvas --package audio-codec-tool -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\Test-Installer.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows x64 diagnostic debug executable
        shell: pwsh
        run: |
          cargo build --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force diagnostic-dist | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\debug\maccanvas.exe diagnostic-dist\MacCanvas-diagnostics-debug-windows-x64.exe
          $hash = (Get-FileHash diagnostic-dist\MacCanvas-diagnostics-debug-windows-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MacCanvas-diagnostics-debug-windows-x64.exe" | Set-Content diagnostic-dist\SHA256SUMS.txt
      - name: Export Windows x64 diagnostic debug executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MacCanvas-diagnostics-debug-windows-x64-${{ github.sha }}
          path: diagnostic-dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Build and package Windows x64 executables
        shell: pwsh
        run: |
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content Cargo.toml -Raw | Select-String '(?m)^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          .\scripts\Package-Release.ps1 -Version "v$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Export verified Windows x64 package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MacCanvas-windows-x64-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
