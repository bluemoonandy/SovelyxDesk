name: Portable Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'false00/maccanvas' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Set up the tested Rust toolchain
        shell: pwsh
        run: |
          rustup show
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Cache Cargo downloads and dependency builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: maccanvas-rust-v1
          shared-key: check # Reuse third-party dependencies from the Windows CI namespace.
          env-vars: ImageOS ImageVersion
          cache-bin: false
          cache-workspace-crates: false
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Preserve the unchanged verified audio component
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .\scripts\Test-AudioComponent.ps1
          # Forks build the converter from the same source; upstream release tags may not exist in origin.
          if ($env:GITHUB_REPOSITORY -eq 'false00/maccanvas') {
            $component = .\scripts\Prepare-AudioComponent.ps1
            if ($component.Reused) {
              "MACCANVAS_AUDIO_COMPONENT=$($component.Path)" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
              "MACCANVAS_AUDIO_COMPONENT_SHA256=$($component.Sha256)" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
      - name: Test and build the viewer and optional audio converter
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path crates\audio-codec-tool\Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --all-targets --locked --package maccanvas --package native-hevc --package audio-codec-tool
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --test windows_clipboard --locked -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --all-targets --locked --package maccanvas --package audio-codec-tool -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\Test-Installer.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --example update_probe --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\Test-SelfUpdate.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package verified executable
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          .\scripts\Package-Release.ps1 -Version $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $portableFiles = @(
            '.\dist\MacCanvas-windows-x64.exe',
            '.\dist\MacCanvas-audio-windows-x64.exe',
            '.\dist\MacCanvas-audio-NOTICES.txt',
            '.\dist\SHA256SUMS.txt'
          )
          Compress-Archive -LiteralPath $portableFiles -DestinationPath .\dist\MacCanvas-windows-x64-portable.zip
          $zipHash = (Get-FileHash .\dist\MacCanvas-windows-x64-portable.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  MacCanvas-windows-x64-portable.zip" | Add-Content .\dist\SHA256SUMS.txt
      - name: Publish immutable release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release view $env:RELEASE_TAG
          if ($LASTEXITCODE -eq 0) { throw "Release already exists; assets will not be overwritten." }
          $notes = Join-Path 'docs\releases' ($env:RELEASE_TAG + '.md')
          $noteArguments = if (Test-Path -LiteralPath $notes) { @('--notes-file', $notes) } else { @('--generate-notes') }
          gh release create $env:RELEASE_TAG --verify-tag --draft --title "MacCanvas $env:RELEASE_TAG" @noteArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $assets = @(
            '.\dist\MacCanvas-windows-x64.exe',
            '.\dist\MacCanvas-audio-windows-x64.exe',
            '.\dist\MacCanvas-audio-NOTICES.txt',
            '.\dist\SHA256SUMS.txt',
            '.\dist\MacCanvas-windows-x64-portable.zip'
          )
          # The existing installer downloads upstream releases; publish it only in the upstream repository.
          if ($env:GH_REPO -eq 'false00/maccanvas') { $assets += '.\dist\install.ps1' }
          gh release upload $env:RELEASE_TAG @assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
